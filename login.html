<!DOCTYPE html><html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-box {
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    a {
        color: #2563eb;
        text-decoration: none;
    }
</style>

</head><body><div class="login-box"><h2>Student Login</h2>

<form method="POST" action="{{ url_for('login') }}">

    <input
        type="email"
        name="email"
        placeholder="Enter Email"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Enter Password"
        required
    >

    <button type="submit">Login</button>

</form>

<p>
    <a href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>
</p>

<p>Don't have an account?
    <a href="{{ url_for('register') }}">Register</a>
</p>

<p>
    <a href="{{ url_for('home') }}">Back to Home</a>
</p>

</div></body>
</html>
