<!DOCTYPE html><html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .box {
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    a {
        color: #2563eb;
        text-decoration: none;
    }
</style>

</head><body><div class="box"><h2>Reset Password</h2>

<p>Enter your OTP and create a new password.</p>

<form method="POST" action="{{ url_for('reset_password') }}">

    <input
        type="text"
        name="otp"
        placeholder="Enter 6-digit OTP"
        pattern="[0-9]{6}"
        maxlength="6"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Enter New Password"
        minlength="8"
        required
    >

    <button type="submit">Reset Password</button>

</form>

<p>
    <a href="{{ url_for('login') }}">Back to Login</a>
</p>

</div></body>
</html>
