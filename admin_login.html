<!DOCTYPE html><html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
    }

    .login-box {
        width: 350px;
        margin: 100px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        text-align: center;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    a {
        color: #2563eb;
        text-decoration: none;
    }
</style>

</head><body><div class="login-box"><h2>Admin Login</h2>

<form method="POST" action="{{ url_for('admin_login') }}">

    <input
        type="text"
        name="username"
        placeholder="Enter Admin Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Enter Admin Password"
        required
    >

    <button type="submit">Admin Login</button>

</form>

<p>
    <a href="{{ url_for('home') }}">Back to Home</a>
</p>

</div></body>
</html>
